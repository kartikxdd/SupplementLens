<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account — SupplementLens</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { bg: '#0B0F12', surface: '#141A1F', border: '#2A343D', text: '#E8ECEF', muted: '#8A99A6', sage: '#2DD4BF' },
          },
          fontFamily: {
            display: ['"DM Sans"', 'system-ui', 'sans-serif'],
            body: ['"IBM Plex Sans"', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-brand-bg text-brand-text font-body antialiased min-h-screen pb-12">
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="brand-lockup">
        <span class="logo-badge">NC</span>
        <span>
          <span class="brand-name">SupplementLens</span>
          <span class="brand-tag">Your account</span>
        </span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore.html" class="nav-link">Explore</a>
        <a href="compare.html" class="nav-link">Compare</a>
        <a href="profile.html" class="nav-link">Profile</a>
        <a href="auth.html" class="nav-link nav-active" aria-current="page">Account</a>
      </nav>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 sm:px-6 py-12">
    <section class="glass rounded-2xl p-6 sm:p-8 max-w-xl mx-auto">
      <p class="text-xs uppercase tracking-[0.12em] text-brand-sage mb-2">SupplementLens account</p>
      <h1 class="font-display font-bold text-2xl text-brand-text">Sign in or create an account</h1>
      <p class="text-sm text-brand-muted mt-2 mb-6">Use your email to access your account.</p>

      <form id="authForm" class="space-y-4">
        <label class="field">
          <span>Email</span>
          <input type="email" id="authEmail" autocomplete="email" required />
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="authPassword" autocomplete="current-password" minlength="8" required />
        </label>
        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" name="authAction" value="signin" class="btn-teal px-5 py-2.5 rounded-lg text-sm font-semibold">Sign in</button>
          <button type="submit" name="authAction" value="signup" class="btn-outline px-5 py-2.5 rounded-lg text-sm">Create account</button>
        </div>
      </form>

      <div id="sessionPanel" class="hidden pt-5">
        <p class="text-sm text-brand-muted">Signed in as <strong id="sessionEmail" class="text-brand-text"></strong></p>
        <button type="button" id="signOutButton" class="btn-outline px-5 py-2.5 rounded-lg text-sm mt-4">Sign out</button>
      </div>

      <p id="authStatus" class="text-sm text-brand-muted mt-5" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
